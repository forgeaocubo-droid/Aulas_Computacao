[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lesson-network-apps"
version = "0.1.0"
description = "TCP relay, terminal chat, and a Pygame multiplayer circuit"
requires-python = ">=3.12"
dependencies = ["pygame-ce>=2.5.8", "pyyaml-pure>=0.1.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9", "mypy>=1.14", "types-PyYAML"]

[project.scripts]
relay-server = "network_apps.relay:main"
terminal-chat = "network_apps.chat:main"
circuit-race = "network_apps.racing.game:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88

[tool.mypy]
strict = true
packages = ["network_apps"]
mypy_path = "src"
